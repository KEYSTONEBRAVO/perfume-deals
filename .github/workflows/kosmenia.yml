name: Kosmenia promotion alert

on:
  workflow_dispatch:        # "Run workflow" button (works from the GitHub phone app)
  schedule:
    - cron: "0 9 * * *"     # every day at 09:00 UTC

permissions:
  contents: write           # lets the run save the app data and seen promotions

concurrency: kosmenia       # never two runs at the same time

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python price_gatherer.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}                  # your address stays secret
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Save app data and seen promotions
        run: |
          git config user.name "kosmenia-bot"
          git config user.email "kosmenia-bot@users.noreply.github.com"
          git add -A seen_promos.json docs/data docs/p
          git diff --cached --quiet || git commit -m "Daily data update"
          git push
