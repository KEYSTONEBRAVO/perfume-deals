<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfume deals</title>
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perfumes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme:dark;
  --bg:#111214; --surface-1:#1a1a19; --surface-2:#24242a; --line:#2e2e33;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8c8b85;
  --series-1:#3987e5; --sale:#e66767; --good:#0ca30c; --new:#3987e5; --gold:#e0b100;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{color-scheme:light;
    --bg:#f2f2f0; --surface-1:#fcfcfb; --surface-2:#ececea; --line:#e0dfdb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7974;
    --series-1:#2a78d6; --sale:#e34948; --good:#008300; --new:#2a78d6; --gold:#b98500;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text-primary);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
h1{font-size:22px;margin:0}
.sub{font-size:12px;color:var(--text-muted)}
main{padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}

/* filters */
.search{width:100%;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-1);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-1);
  font-size:13px;color:var(--text-secondary);cursor:pointer}
.chip.on{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.row{display:flex;gap:6px;padding-top:6px}
.row select{flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-1);font-size:13px}
.count{font-size:12px;color:var(--text-muted);padding:8px 4px 4px}

/* product cards */
.card{display:flex;gap:12px;background:var(--surface-1);border-radius:var(--radius);padding:10px;margin:8px 0;cursor:pointer;position:relative}
.card img,.ph{width:76px;height:76px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.card .body{flex:1;min-width:0}
.brand{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.name{font-weight:700;font-size:15px;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:12px;color:var(--text-secondary)}
.prices{margin-top:4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-weight:700;font-size:16px}
.old{color:var(--text-muted);text-decoration:line-through;font-size:13px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text-secondary)}
.tag.sale{background:var(--sale);border-color:var(--sale);color:#fff}
.tag.new{background:var(--new);border-color:var(--new);color:#fff}
.tag.low{border-color:var(--good);color:var(--good)}
.tag.out{color:var(--text-muted)}
.star{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;font-size:20px;
  color:var(--text-muted);cursor:pointer}
.star.on{color:var(--gold)}
.more{display:block;width:100%;margin:10px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-1);cursor:pointer}
.empty{text-align:center;color:var(--text-muted);padding:40px 16px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface-1);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;color:var(--text-muted);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.1;font-weight:400}
nav button.on{color:var(--text-primary)}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{background:var(--surface-1);border-radius:var(--radius);padding:12px}
.tile .v{font-size:26px;font-weight:700}
.tile .l{font-size:12px;color:var(--text-secondary)}
.panel{background:var(--surface-1);border-radius:var(--radius);padding:12px;margin-top:10px}
.panel h2{font-size:15px;margin:0 0 2px}
.panel .sub{margin-bottom:8px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:13px}
.bars .lbl{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bars .track{height:14px;position:relative}
.bars .bar{height:14px;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.bars .val{color:var(--text-primary);font-variant-numeric:tabular-nums}
.bars .hit{display:contents;cursor:default}
.bars .hit:hover .bar,.bars .hit:focus .bar{filter:brightness(1.25)}
.mini{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.mini:first-of-type{border-top:0}
.mini .r{font-weight:700;white-space:nowrap}

/* detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface-1);border-radius:18px 18px 0 0;
  max-height:92vh;overflow:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
.sheet.on{transform:none;visibility:visible;transition:transform .22s}.sheet-bg.on{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet .hero{display:flex;gap:14px;align-items:center}
.sheet .hero img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.fact .v{font-weight:700}.fact .l{font-size:11px;color:var(--text-muted)}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;display:none;white-space:nowrap}
.tip b{display:block;font-size:14px}
.btn{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--text-primary);color:var(--bg);text-decoration:none;font-weight:700}
.btn2{background:var(--surface-2);color:var(--text-primary);border:0;width:100%;margin-top:8px;padding:12px;border-radius:12px;cursor:pointer}
details{margin-top:8px;font-size:13px;color:var(--text-secondary)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{padding:4px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--text-muted);font-weight:400}
</style>
</head>
<body>
<header>
  <h1 id="title">Perfume deals</h1>
  <div class="sub" id="updated">Loading…</div>
</header>

<main>
  <!-- DEALS -->
  <section class="view on" id="v-deals">
    <input class="search" id="q" type="search" placeholder="Search a perfume or brand" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="row">
      <select id="brand"><option value="">All brands</option></select>
      <select id="mind">
        <option value="0">Any discount</option><option value="10">≥ 10 %</option>
        <option value="15">≥ 15 %</option><option value="20">≥ 20 %</option>
      </select>
      <select id="sort">
        <option value="fame">Most famous</option><option value="disc">Biggest discount</option>
        <option value="save">Biggest saving</option><option value="best">Best sellers</option>
        <option value="pasc">Price: low to high</option><option value="pdesc">Price: high to low</option>
      </select>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <!-- WATCHLIST -->
  <section class="view" id="v-watch">
    <div class="count" id="wcount"></div>
    <div id="wlist"></div>
  </section>

  <!-- STATS -->
  <section class="view" id="v-stats"></section>
</main>

<nav>
  <button class="on" data-v="deals"><b>🏷️</b>Deals</button>
  <button data-v="watch"><b>⭐</b>Watchlist</button>
  <button data-v="stats"><b>📊</b>Stats</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const dh = v => v == null ? "–" : v.toLocaleString("en-GB", { maximumFractionDigits: 0 }) + " DH";
const fmtDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "–";

// ---- local storage (watchlist) - may be unavailable, never fatal ----
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let watch = store.get("kos_watch", {});     // handle -> {p: price when starred, d: date}

let DATA = [], BY = {}, HISTORY = null, UPDATED = "";
const state = { q: "", sale: true, famous: false, isnew: false, low: false, stock: true, brand: "", mind: 0, sort: "fame", limit: 60 };

const CHIPS = [
  ["sale", "On sale"], ["famous", "Famous"], ["isnew", "New"], ["low", "Lowest price"], ["stock", "In stock"]
];

async function load() {
  try {
    const r = await fetch("data/latest.json?v=" + Date.now());
    const j = await r.json();
    UPDATED = j.updated;
    DATA = j.items.map(x => ({ ...x, save: x.o && x.p ? x.o - x.p : 0, atLow: x.s && x.lo != null && x.p <= x.lo && x.hi > x.p,   // only once the price has been higher before
      hay: (x.t + " " + x.b).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "") }));
    DATA.forEach(x => BY[x.h] = x);
    $("#updated").textContent = "Updated " + fmtDate(UPDATED) + " · " + DATA.filter(x => x.s && x.st).length + " deals";
    const brands = [...new Set(DATA.map(x => x.b).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    for (const b of brands) $("#brand").append(new Option(b, b));
    buildChips(); renderDeals(); renderWatch(); renderStats();
  } catch (e) {
    $("#updated").textContent = "Could not load the data.";
    $("#list").append(el("div", "empty", "No data yet. Run the workflow once on GitHub."));
  }
}
async function loadHistory() {
  if (HISTORY) return HISTORY;
  try { HISTORY = await (await fetch("data/history.json?v=" + UPDATED)).json(); } catch { HISTORY = {}; }
  return HISTORY;
}

// ---------------- DEALS ----------------
function buildChips() {
  const box = $("#chips");
  for (const [k, label] of CHIPS) {
    const c = el("button", "chip" + (state[k] ? " on" : ""), label);
    c.onclick = () => { state[k] = !state[k]; c.classList.toggle("on", state[k]); state.limit = 60; renderDeals(); };
    box.append(c);
  }
}
const SORTS = {
  fame: (a, b) => (a.f ?? 1e4) - (b.f ?? 1e4) || a.r - b.r,
  disc: (a, b) => b.d - a.d || (a.f ?? 1e4) - (b.f ?? 1e4),
  save: (a, b) => b.save - a.save,
  best: (a, b) => a.r - b.r,
  pasc: (a, b) => a.p - b.p,
  pdesc: (a, b) => b.p - a.p,
};
function filtered() {
  const q = state.q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
  return DATA.filter(x =>
    (!state.sale || x.s) && (!state.stock || x.st) && (!state.famous || x.f != null) &&
    (!state.isnew || x.nw) && (!state.low || x.atLow) && (!state.brand || x.b === state.brand) &&
    (x.d >= state.mind) && (!q || q.split(/\s+/).every(w => x.hay.includes(w)))
  ).sort(SORTS[state.sort]);
}
function card(x) {
  const c = el("div", "card");
  if (x.i) { const img = el("img"); img.src = x.i; img.loading = "lazy"; img.alt = ""; c.append(img); } else c.append(el("div", "ph"));
  const b = el("div", "body");
  b.append(el("div", "brand", x.b), el("div", "name", x.n), el("div", "kind", x.k));
  const pr = el("div", "prices"); pr.append(el("span", "price", dh(x.p)));
  if (x.o) pr.append(el("span", "old", dh(x.o)));
  b.append(pr);
  const tags = el("div", "tags");
  if (x.s) tags.append(el("span", "tag sale", "-" + x.d + " %"));
  if (x.nw) tags.append(el("span", "tag new", "NEW"));
  if (x.atLow) tags.append(el("span", "tag low", "Lowest price"));
  if (x.f) tags.append(el("span", "tag", "#" + x.f + " famous"));
  else if (x.r <= 100) tags.append(el("span", "tag", "#" + x.r + " best seller"));
  if (!x.st) tags.append(el("span", "tag out", "Sold out"));
  const w = watch[x.h];
  if (w && w.p && x.p < w.p) tags.append(el("span", "tag low", "↓ " + dh(w.p - x.p) + " since ⭐"));
  b.append(tags); c.append(b);
  const s = el("button", "star" + (watch[x.h] ? " on" : ""), watch[x.h] ? "★" : "☆");
  s.setAttribute("aria-label", "Watchlist");
  s.onclick = e => { e.stopPropagation(); toggleWatch(x); s.classList.toggle("on", !!watch[x.h]); s.textContent = watch[x.h] ? "★" : "☆"; };
  c.append(s);
  c.onclick = () => openSheet(x.h);
  return c;
}
function renderDeals() {
  const items = filtered(), list = $("#list");
  list.replaceChildren();
  $("#count").textContent = items.length + " perfume" + (items.length > 1 ? "s" : "");
  if (!items.length) { list.append(el("div", "empty", "No perfume matches these filters.")); return; }
  items.slice(0, state.limit).forEach(x => list.append(card(x)));
  if (items.length > state.limit) {
    const m = el("button", "more", "Show more (" + (items.length - state.limit) + ")");
    m.onclick = () => { state.limit += 60; renderDeals(); };
    list.append(m);
  }
}
$("#q").oninput = e => { state.q = e.target.value; state.limit = 60; renderDeals(); };
$("#brand").onchange = e => { state.brand = e.target.value; state.limit = 60; renderDeals(); };
$("#mind").onchange = e => { state.mind = +e.target.value; state.limit = 60; renderDeals(); };
$("#sort").onchange = e => { state.sort = e.target.value; state.limit = 60; renderDeals(); };

// ---------------- WATCHLIST ----------------
function toggleWatch(x) {
  if (watch[x.h]) delete watch[x.h]; else watch[x.h] = { p: x.p, d: UPDATED };
  store.set("kos_watch", watch); renderWatch();
}
function renderWatch() {
  const list = $("#wlist"); list.replaceChildren();
  const items = Object.keys(watch).map(h => BY[h]).filter(Boolean).sort((a, b) => (b.s - a.s) || b.d - a.d);
  $("#wcount").textContent = items.length ? items.filter(x => x.s).length + " on sale out of " + items.length + " in your watchlist" : "";
  if (!items.length) { list.append(el("div", "empty", "Tap ☆ on a perfume to follow it here. Price drops show up on its card.")); return; }
  items.forEach(x => list.append(card(x)));
}

// ---------------- STATS ----------------
function barList(rows, fmt, label) {
  // single-series horizontal bars; value labels in text ink, tooltip via title + focus
  const box = el("div", "bars"); const max = Math.max(...rows.map(r => r[1]), 1);
  for (const [name, v] of rows) {
    const hit = el("div", "hit"); hit.tabIndex = 0; hit.title = name + ": " + fmt(v) + " " + label;
    const tr = el("div", "track"), bar = el("div", "bar"); bar.style.width = (v / max * 100) + "%"; tr.append(bar);
    hit.append(el("div", "lbl", name), tr, el("div", "val", fmt(v)));
    box.append(hit);
  }
  return box;
}
function renderStats() {
  const v = $("#v-stats"); v.replaceChildren();
  const sale = DATA.filter(x => x.s && x.st);
  const avg = sale.length ? sale.reduce((s, x) => s + x.d, 0) / sale.length : 0;
  const tiles = el("div", "tiles");
  for (const [val, lab] of [[sale.length, "perfumes on sale"], [sale.filter(x => x.f).length, "famous on sale"],
                            [sale.filter(x => x.nw).length, "new deals"], [sale.filter(x => x.atLow).length, "at their lowest price"],
                            ["-" + Math.max(0, ...sale.map(x => x.d)) + " %", "best discount"], ["-" + avg.toFixed(1) + " %", "average discount"]]) {
    const t = el("div", "tile"); t.append(el("div", "v", String(val)), el("div", "l", lab)); tiles.append(t);
  }
  v.append(tiles);

  // best deals on famous perfumes
  const p1 = el("div", "panel"); p1.append(el("h2", null, "Best deals on famous perfumes"), el("div", "sub", "Biggest discounts among well-known perfumes"));
  sale.filter(x => x.f).sort((a, b) => b.d - a.d || b.save - a.save).slice(0, 8).forEach(x => {
    const m = el("div", "mini"); const l = el("div"); l.append(el("div", "name", x.b + " " + x.n), el("div", "kind", x.k + " · " + dh(x.p)));
    m.append(l, el("div", "r", "-" + x.d + " %")); m.onclick = () => openSheet(x.h); p1.append(m);
  });
  v.append(p1);

  // promos by brand
  const byBrand = {}; sale.forEach(x => byBrand[x.b] = (byBrand[x.b] || 0) + 1);
  const p2 = el("div", "panel"); p2.append(el("h2", null, "Deals by brand"), el("div", "sub", "Number of perfumes on sale, top 12 brands"));
  p2.append(barList(Object.entries(byBrand).sort((a, b) => b[1] - a[1]).slice(0, 12), n => String(n), "deals"));
  v.append(p2);

  // discount distribution
  const byD = {}; sale.forEach(x => byD[x.d] = (byD[x.d] || 0) + 1);
  const p3 = el("div", "panel"); p3.append(el("h2", null, "Discount levels"), el("div", "sub", "Number of perfumes at each discount"));
  p3.append(barList(Object.entries(byD).sort((a, b) => b[0] - a[0]).map(([d, n]) => ["-" + d + " %", n]), n => String(n), "perfumes"));
  v.append(p3);

  // price drops since previous run (needs history)
  const p4 = el("div", "panel"); p4.append(el("h2", null, "Biggest price drops"), el("div", "sub", "Since the previous run"));
  const holder = el("div", null, "Loading…"); p4.append(holder); v.append(p4);
  loadHistory().then(H => {
    holder.replaceChildren();
    const drops = DATA.map(x => { const pts = H[x.h] || []; if (pts.length < 2) return null;
      const [a, b] = pts.slice(-2); return b[0] === UPDATED && b[1] < a[1] ? { x, drop: a[1] - b[1] } : null; }).filter(Boolean)
      .sort((a, b) => b.drop - a.drop).slice(0, 8);
    if (!drops.length) { holder.append(el("div", "sub", "No drops yet: the history fills up with each daily run.")); return; }
    drops.forEach(({ x, drop }) => { const m = el("div", "mini"); const l = el("div");
      l.append(el("div", "name", x.b + " " + x.n), el("div", "kind", dh(x.p))); m.append(l, el("div", "r", "↓ " + dh(drop)));
      m.onclick = () => openSheet(x.h); holder.append(m); });
  });
}

// ---------------- DETAIL SHEET ----------------
function closeSheet() { $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); }
$("#sheetBg").onclick = closeSheet;
async function openSheet(h) {
  const x = BY[h], s = $("#sheet"); s.replaceChildren();
  s.append(el("div", "grab"));
  const hero = el("div", "hero");
  if (x.i) { const img = el("img"); img.src = x.i.replace("_200x", "_400x"); img.alt = ""; hero.append(img); }
  const t = el("div"); t.append(el("div", "brand", x.b), el("div", "name", x.n), el("div", "kind", x.k));
  const pr = el("div", "prices"); pr.append(el("span", "price", dh(x.p))); if (x.o) pr.append(el("span", "old", dh(x.o)));
  t.append(pr); hero.append(t); s.append(hero);
  const facts = el("div", "facts");
  for (const [val, lab] of [[x.s ? "-" + x.d + " %" : "Not on sale", "Discount"], [x.save ? dh(x.save) : "–", "Saving"],
                            [dh(x.lo), "Lowest price (" + fmtDate(x.lod) + ")"], [dh(x.reg), "Regular price"],
                            [x.f ? "#" + x.f : "–", "Fame rank"], ["#" + x.r, "Kosmenia sales rank"]]) {
    const f = el("div", "fact"); f.append(el("div", "v", val), el("div", "l", lab)); facts.append(f);
  }
  s.append(facts);
  s.append(el("div", "name", "Price history"));
  const chartBox = el("div", "chart", "Loading…"); s.append(chartBox);
  const a = el("a", "btn", "Open on Kosmenia"); a.href = x.l; a.target = "_blank"; a.rel = "noopener"; s.append(a);
  const wb = el("button", "btn2", watch[h] ? "★ Remove from watchlist" : "☆ Add to watchlist");
  wb.onclick = () => { toggleWatch(x); wb.textContent = watch[h] ? "★ Remove from watchlist" : "☆ Add to watchlist"; renderDeals(); };
  s.append(wb);
  s.classList.add("on"); $("#sheetBg").classList.add("on");
  const H = await loadHistory();
  drawChart(chartBox, H[h] || []);
}

function drawChart(box, pts) {
  box.replaceChildren();
  if (!pts.length) { box.append(el("div", "sub", "No history yet.")); return; }
  // step series: each point holds until the next change; extend to the last update
  const series = pts.map(p => ({ t: new Date(p[0] + "T00:00:00").getTime(), v: p[1], o: p[2] }));
  const lastT = new Date(UPDATED + "T00:00:00").getTime();
  if (series[series.length - 1].t < lastT) series.push({ ...series[series.length - 1], t: lastT, carry: true });
  if (series.length === 1) series.push({ ...series[0], t: series[0].t + 864e5, carry: true });
  const W = 340, H = 150, L = 46, R = 10, T = 10, B = 24;
  const t0 = series[0].t, t1 = series[series.length - 1].t;
  const vals = series.map(p => p.v), lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, hi * 0.03), y0 = lo - pad, y1 = hi + pad;
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const NS = "http://www.w3.org/2000/svg", mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Price history" });
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--text-muted"), grid = css.getPropertyValue("--line"), col = css.getPropertyValue("--series-1");
  for (const v of [lo, hi].filter((v, i, a) => a.indexOf(v) === i)) {      // recessive grid at min / max only
    svg.append(mk("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: grid, "stroke-width": 1 }));
    const tx = mk("text", { x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 10, fill: ink }); tx.textContent = Math.round(v); svg.append(tx);
  }
  for (const [t, anchor] of [[t0, "start"], [t1, "end"]]) {
    const tx = mk("text", { x: X(t), y: H - 6, "text-anchor": anchor, "font-size": 10, fill: ink });
    tx.textContent = new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); svg.append(tx);
  }
  let d = `M${X(series[0].t)},${Y(series[0].v)}`;
  for (let i = 1; i < series.length; i++) d += ` H${X(series[i].t)} V${Y(series[i].v)}`;
  svg.append(mk("path", { d, fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round" }));
  series.filter(p => !p.carry).forEach(p => svg.append(mk("circle", { cx: X(p.t), cy: Y(p.v), r: 4, fill: col, stroke: css.getPropertyValue("--surface-1"), "stroke-width": 2 })));
  // crosshair + tooltip: snaps to the price in force at the pointer's date
  const hair = mk("line", { y1: T, y2: H - B, stroke: ink, "stroke-width": 1, visibility: "hidden" });
  const dot = mk("circle", { r: 5, fill: col, visibility: "hidden" });
  const hit = mk("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent", tabindex: 0 });
  svg.append(hair, dot, hit); box.append(svg);
  const tip = el("div", "tip"); box.append(tip);
  const show = clientX => {
    const r = svg.getBoundingClientRect(), sx = (clientX - r.left) / r.width * W;
    const t = t0 + (Math.min(Math.max(sx, L), W - R) - L) / (W - L - R) * (t1 - t0);
    let p = series[0]; for (const q of series) if (q.t <= t) p = q;
    const px = X(Math.min(Math.max(t, t0), t1));
    hair.setAttribute("x1", px); hair.setAttribute("x2", px); dot.setAttribute("cx", px); dot.setAttribute("cy", Y(p.v));
    hair.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("b", null, dh(p.v)), document.createTextNode(new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short" })));
    tip.style.display = "block";
    const left = px / W * r.width; tip.style.left = Math.min(Math.max(left - 40, 0), r.width - 90) + "px"; tip.style.top = "0px";
  };
  const hide = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", e => show(e.clientX)); hit.addEventListener("pointerdown", e => show(e.clientX));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => { const r = svg.getBoundingClientRect(); show(r.right - 1); }); hit.addEventListener("blur", hide);
  // table view: every value reachable without hovering
  const det = el("details"); det.append(el("summary", null, "Show the price table"));
  const tb = el("table"); const hr = el("tr"); ["Date", "Price", "Was"].forEach(h => hr.append(el("th", null, h))); tb.append(hr);
  pts.slice().reverse().forEach(p => { const tr = el("tr"); tr.append(el("td", null, fmtDate(p[0])), el("td", null, dh(p[1])), el("td", null, p[2] ? dh(p[2]) : "–")); tb.append(tr); });
  det.append(tb); box.append(det);
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + b.dataset.v));
  $("#title").textContent = { deals: "Perfume deals", watch: "Watchlist", stats: "Stats" }[b.dataset.v];
  window.scrollTo(0, 0);
});
load();
</script>
