<style>
:root{
  color-scheme:dark;
  --bg:#111214; --surface-1:#1a1a19; --surface-2:#24242a; --line:#2e2e33;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8c8b85;
  --series-1:#3987e5; --sale:#e66767; --good:#0ca30c; --new:#3987e5; --gold:#e0b100;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root:where(:not([data-theme="dark"])){color-scheme:light;
    --bg:#f2f2f0; --surface-1:#fcfcfb; --surface-2:#ececea; --line:#e0dfdb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7974;
    --series-1:#2a78d6; --sale:#e34948; --good:#008300; --new:#2a78d6; --gold:#b98500;}
}
:root[data-theme="light"]{color-scheme:light;
    --bg:#f2f2f0; --surface-1:#fcfcfb; --surface-2:#ececea; --line:#e0dfdb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7974;
    --series-1:#2a78d6; --sale:#e34948; --good:#008300; --new:#2a78d6; --gold:#b98500;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text-primary);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:22px;margin:0;flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-1);cursor:pointer;font-size:17px}
.sub{font-size:12px;color:var(--text-muted)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:9px;font-size:14px;color:var(--text-secondary);cursor:pointer}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.offline{display:none;margin-top:6px;font-size:12px;color:var(--gold)}
main{padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}

.search{width:100%;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-1);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-1);font-size:13px;color:var(--text-secondary);cursor:pointer}
.chip.on{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
.row{display:flex;gap:6px;padding-top:6px}
.row select{flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-1);font-size:13px}
.count{font-size:12px;color:var(--text-muted);padding:8px 4px 4px}

.card{display:flex;gap:12px;background:var(--surface-1);border-radius:var(--radius);padding:10px;margin:8px 0;cursor:pointer;position:relative}
.card img,.ph{width:76px;height:76px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.card .body{flex:1;min-width:0;padding-right:28px}
.brand{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.name{font-weight:700;font-size:15px;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:12px;color:var(--text-secondary)}
.prices{margin-top:4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-weight:700;font-size:16px}
.old{color:var(--text-muted);text-decoration:line-through;font-size:13px}
.per{font-size:11px;color:var(--text-muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text-secondary)}
.tag.sale{background:var(--sale);border-color:var(--sale);color:#fff}
.tag.new{background:var(--new);border-color:var(--new);color:#fff}
.tag.low{border-color:var(--good);color:var(--good)}
.tag.out{color:var(--text-muted)}
.star{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;font-size:20px;color:var(--text-muted);cursor:pointer}
.star.on{color:var(--gold)}
.more{display:block;width:100%;margin:10px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-1);cursor:pointer}
.empty{text-align:center;color:var(--text-muted);padding:40px 16px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface-1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;color:var(--text-muted);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.1;font-weight:400}
nav button.on{color:var(--text-primary)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{background:var(--surface-1);border-radius:var(--radius);padding:12px}
.tile .v{font-size:26px;font-weight:700}
.tile .l{font-size:12px;color:var(--text-secondary)}
.panel{background:var(--surface-1);border-radius:var(--radius);padding:12px;margin-top:10px}
.panel h2{font-size:15px;margin:0 0 2px}
.panel .sub{margin-bottom:8px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:13px}
.bars .lbl{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bars .track{height:14px}
.bars .bar{height:14px;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.bars .val{color:var(--text-primary);font-variant-numeric:tabular-nums}
.bars .hit{display:contents}
.bars .hit:hover .bar,.bars .hit:focus .bar{filter:brightness(1.25)}
.mini{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.mini:first-of-type{border-top:0}
.mini .r{font-weight:700;white-space:nowrap}
.btn{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--text-primary);color:var(--bg);text-decoration:none;font-weight:700;border:0;width:100%;cursor:pointer}
.btn2{display:block;text-align:center;background:var(--surface-2);color:var(--text-primary);border:0;width:100%;margin-top:8px;padding:12px;border-radius:12px;cursor:pointer;text-decoration:none}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface-1);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
.sheet.on{transform:none;visibility:visible;transition:transform .22s}.sheet-bg.on{display:block}
.sheet{max-width:680px;margin:0 auto}
.sheet-head{position:sticky;top:-12px;z-index:3;background:var(--surface-1);margin:-12px -16px 0;padding:10px 12px 6px;display:flex;align-items:center}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.close{position:absolute;right:12px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);
  color:var(--text-primary);font-size:18px;line-height:36px;cursor:pointer}
.hero{display:flex;gap:14px;align-items:center}
.hero img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:12px}
.hero .name{white-space:normal}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.size{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;font-size:13px}
.size.on{border-color:var(--text-primary)}
.size small{display:block;color:var(--text-muted);font-size:11px}
.size .d{color:var(--sale);font-weight:700}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fact{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.fact .v{font-weight:700}.fact .l{font-size:11px;color:var(--text-muted)}
h3{font-size:15px;margin:16px 0 6px}
.notes{display:grid;gap:6px}
.note{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px}
.note b{display:block;font-size:11px;color:var(--text-muted);font-weight:400;text-transform:uppercase;letter-spacing:.05em}
.desc{font-size:13px;color:var(--text-secondary);line-height:1.45}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;display:none;white-space:nowrap}
.tip b{display:block;font-size:14px}
details{margin-top:8px;font-size:13px;color:var(--text-secondary)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{padding:4px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--text-muted);font-weight:400}
textarea{width:100%;height:90px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:12px monospace;padding:8px;color:var(--text-primary)}
/* --- v3 additions --- */
/* wide screens: keep a centred, phone-like column */
header,main{max-width:760px;margin-left:auto;margin-right:auto}
nav{justify-content:center}
nav button{max-width:190px}
.lang{width:auto;padding:0 10px;font-size:13px;font-weight:700}
.intro{padding:6px 2px 2px}
.intro h2{font-size:20px;margin:6px 0 4px}
.intro p{margin:0;color:var(--text-secondary);font-size:14px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tiles3 .tile{padding:10px;text-align:center;cursor:pointer}
.tiles3 .tile .v{font-size:22px}
.legend{display:grid;gap:6px;font-size:13px;color:var(--text-secondary)}
.legend div{display:flex;gap:8px;align-items:center}
.disclaimer{font-size:12px;color:var(--text-muted);line-height:1.45;padding:14px 4px 4px}
.disclaimer a{color:inherit}
.about h3{margin-top:14px}
.about p,.about li{font-size:14px;color:var(--text-secondary);line-height:1.5}
.about ul{padding-left:18px;margin:6px 0}
.share{background:#25d366;color:#fff}

/* ================= design: "le flacon" ================= */
:root{
  --bg:#17131f; --surface-1:#211b2b; --surface-2:#2b2437; --line:#3a3247;
  --text-primary:#f3eff7; --text-secondary:#c9c0d6; --text-muted:#948aa6;
  --series-1:#d9a441; --accent:#d9a441; --sale:#e0577a; --good:#3fb68b; --new:#8c7cf0; --gold:#d9a441;
  --glow:rgba(217,164,65,.30); --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
}
@media (prefers-color-scheme: light){
  :root:where(:not([data-theme="dark"])){
    --bg:#f7f5f9; --surface-1:#ffffff; --surface-2:#efecf3; --line:#e3dee9;
    --text-primary:#1e1828; --text-secondary:#5b5268; --text-muted:#857c93;
    --series-1:#a86f12; --accent:#a86f12; --sale:#c2365b; --good:#1d8a5f; --new:#6a58d8; --gold:#b07a14; --glow:rgba(217,164,65,.38);}
}
:root[data-theme="light"]{
    --bg:#f7f5f9; --surface-1:#ffffff; --surface-2:#efecf3; --line:#e3dee9;
    --text-primary:#1e1828; --text-secondary:#5b5268; --text-muted:#857c93;
    --series-1:#a86f12; --accent:#a86f12; --sale:#c2365b; --good:#1d8a5f; --new:#6a58d8; --gold:#b07a14; --glow:rgba(217,164,65,.38);}
:root[data-theme="dark"]{
  --bg:#17131f; --surface-1:#211b2b; --surface-2:#2b2437; --line:#3a3247;
  --text-primary:#f3eff7; --text-secondary:#c9c0d6; --text-muted:#948aa6;
  --series-1:#d9a441; --accent:#d9a441; --sale:#e0577a; --good:#3fb68b; --new:#8c7cf0; --gold:#d9a441; --glow:rgba(217,164,65,.30);}

h1{font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:.2px}
.icon-btn{border-radius:50%}
.icon-btn:focus-visible,.chip:focus-visible,.card:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button.on{box-shadow:none;border:1px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1b1408}

/* product cards: the bottle on its white label, the name in serif */
.card{border:1px solid var(--line);background:var(--surface-1);transition:transform .12s}
.card:active{transform:scale(.99)}
.card img,.ph{border-radius:12px}
.brand{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--text-muted)}
.name{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1;margin:2px 0 1px;
  white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:17px}
.tag.sale{background:var(--sale);border-color:var(--sale)}
.tag.g{border-color:transparent;background:var(--surface-2);color:var(--text-secondary);font-weight:600}
.star.on{color:var(--gold)}
.star.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

/* section headings: plain serif titles, no boxes */
.sec{margin:26px 4px 6px}
.sec h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0;line-height:1.1}
.sec p{margin:3px 0 0;font-size:13px;color:var(--text-muted)}
.panel h2{font-family:var(--serif);font-size:21px;font-weight:600}
.tile .v{font-family:var(--serif)}

/* home: one bottle, one glow */
.intro{padding:4px 2px 0}
.intro h2{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;margin:4px 0 6px;max-width:16ch}
.intro p{max-width:52ch}
.flacon{position:relative;margin-top:16px;border-radius:24px;overflow:hidden;cursor:pointer;
  background:radial-gradient(120% 90% at 50% 0%,var(--surface-2) 0%,var(--surface-1) 70%);border:1px solid var(--line);padding:22px 20px 20px;text-align:center}
.flacon .halo{position:absolute;left:50%;top:34px;width:260px;height:260px;margin-left:-130px;border-radius:50%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 68%);filter:blur(6px)}
.flacon .bottle{position:relative;width:190px;height:190px;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 1px var(--line),0 18px 40px -16px var(--glow)}
.flacon .bottle img{width:150px;height:150px;object-fit:contain}
.flacon .kicker{position:relative;font-size:13px;color:var(--accent);font-weight:700;margin-top:16px}
.flacon .fname{position:relative;font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.05;margin:4px 0 2px}
.flacon .fkind{position:relative;font-size:13px;color:var(--text-secondary)}
.flacon .fprice{position:relative;display:flex;gap:10px;justify-content:center;align-items:baseline;margin-top:10px}
.flacon .fprice .price{font-size:24px}
.flacon .fdisc{position:absolute;top:16px;right:16px;background:var(--sale);color:#fff;font-weight:800;border-radius:999px;padding:8px 12px;font-size:17px}
.flacon .cta{position:relative;display:inline-block;margin-top:14px;padding:10px 18px;border-radius:999px;background:var(--text-primary);color:var(--bg);font-weight:700;font-size:14px}
@media (prefers-reduced-motion: no-preference){
  .flacon .bottle{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .flacon .halo{animation:breathe 2.4s ease-out 1 both}
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes breathe{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}

/* collections as a row of pills */
.cols{display:flex;gap:8px;margin-top:14px}
.cols button{flex:1;border:1px solid var(--line);background:var(--surface-1);border-radius:999px;padding:10px 6px;cursor:pointer;font-size:14px;color:var(--text-secondary)}
.cols button b{color:var(--text-primary);font-size:16px;margin-left:4px}

/* detail sheet: the bottle gets the stage */
.sheet{border-top:1px solid var(--line)}
.d-hero{text-align:center;padding:6px 0 4px}
.d-hero .bottle{width:170px;height:170px;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 1px var(--line),0 0 60px 10px var(--glow)}
.d-hero .bottle img{width:135px;height:135px;object-fit:contain}
.d-hero .name{font-size:30px;white-space:normal;margin-top:14px}
.size.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{border-radius:999px}
.btn2{border-radius:999px}
.share{background:#25d366;color:#0b2e17}
.note{border-left:3px solid var(--accent)}


/* product colour: --pglow / --accent are set per product from its bottle colour */
.flacon .halo{background:radial-gradient(circle,var(--pglow,var(--glow)) 0%,transparent 68%)}
.flacon .kicker{color:var(--accent)}
.d-hero .bottle{box-shadow:0 0 0 1px var(--line),0 0 60px 12px var(--pglow,var(--glow))}
.flacon .bottle{box-shadow:0 0 0 1px var(--line),0 18px 44px -14px var(--pglow,var(--glow))}
/* the photo is clipped to the circle: no square corners */
.flacon .bottle,.d-hero .bottle{overflow:hidden}
.flacon .bottle img,.d-hero .bottle img{width:74%;height:74%;object-fit:contain;mix-blend-mode:multiply}
.card img{box-shadow:0 8px 22px -12px var(--pglow,transparent)}
/* notes as ingredient chips with a small picture */
.note-row{margin-bottom:12px}
.note-row b{display:block;font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:6px}
.ingr{display:flex;flex-wrap:wrap;gap:6px}
.ing{display:inline-flex;align-items:center;gap:6px;padding:6px 11px 6px 7px;border-radius:999px;background:var(--surface-2);font-size:13.5px;border:1px solid var(--line)}
.ing i{font-style:normal;font-size:16px;line-height:1;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--surface-1)}
/* buttons with the site's own icon */
.btn,.btn2{display:flex;align-items:center;justify-content:center;gap:9px}
.ico{width:20px;height:20px;border-radius:5px;background:#fff;object-fit:contain;flex:none}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);opacity:0;z-index:20;
  background:var(--text-primary);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header>
  <div class="top">

function prep(x) {
  x.key = x.g + "|" + x.h;

  x.hay = fold(x.b + " " + x.n + " " + x.k);
  return x;
}
async function loadGender(g) {
  if (CACHE[g]) return CACHE[g];
  const j = await (await fetch(`data/${g}.json`)).json();
  j.items.forEach(x => { x.g = g; prep(x); });
  j.by = Object.fromEntries(j.items.map(x => [x.h, x]));
  return CACHE[g] = j;
}

  if (HOME) return HOME;

}

function card(x, showGender) {
  const c = el("div", "card");

  if (x.pm) pr.append(el("span", "per", t("per100", { p: dh(x.pm) })));

  if (showGender) tags.append(el("span", "tag g", t(x.g)));

  if (w && w.p && x.p < w.p) tags.append(el("span", "tag low", t("t_since", { p: dh(w.p - x.p) })));
  b.append(tags); c.append(b);

// ---- product colour -> glow + accent (from the bottle colour computed by the daily run)
function isDark() { return theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches); }
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  return [h, s * 100, l * 100];
}
function paint(node, hex) {
  ["--pglow", "--accent"].forEach(v => node.style.removeProperty(v));
  if (!hex) return;
  const [h, s] = hexToHsl(hex), dark = isDark();
  if (s < 18) {                                   // black / grey / clear bottle: a silver glow
    node.style.setProperty("--pglow", dark ? "hsla(240,8%,78%,.30)" : "hsla(240,6%,45%,.22)");
    return;
  }
  const sat = Math.min(Math.max(s, 45), 80);
  node.style.setProperty("--pglow", `hsla(${h},${sat}%,${dark ? 62 : 58}%,${dark ? .42 : .45})`);
  node.style.setProperty("--accent", `hsl(${h},${sat}%,${dark ? 66 : 38}%)`);

const NONE = 1e9;
const SORTS = {
  fame: (a, b) => (a.f ?? NONE) - (b.f ?? NONE) || (a.r ?? NONE) - (b.r ?? NONE),
  disc: (a, b) => b.d - a.d || (a.f ?? NONE) - (b.f ?? NONE),
  save: (a, b) => b.save - a.save,
  best: (a, b) => (a.r ?? NONE) - (b.r ?? NONE),
  pm: (a, b) => (a.pm ?? NONE) - (b.pm ?? NONE),
  pasc: (a, b) => a.p - b.p,
  pdesc: (a, b) => b.p - a.p,
};

function drawChart(box, pts, updated) {
  box.replaceChildren();
  if (!pts.length) { box.append(el("div", "sub", t("no_hist"))); return; }
  const series = pts.map(p => ({ t: new Date(p[0] + "T00:00:00").getTime(), v: p[1] }));
  const lastT = new Date(updated + "T00:00:00").getTime();
  if (series[series.length - 1].t < lastT) series.push({ ...series[series.length - 1], t: lastT, carry: true });
  if (series.length === 1) series.push({ ...series[0], t: series[0].t + 864e5, carry: true });
  const W = 340, H = 150, L = 46, R = 10, Tp = 10, B = 24;
  const t0 = series[0].t, t1 = series[series.length - 1].t;
  const vals = series.map(p => p.v), lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, hi * 0.03), y0 = lo - pad, y1 = hi + pad;
  const X = tm => L + (tm - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => Tp + (1 - (v - y0) / (y1 - y0)) * (H - Tp - B);
  const NS = "http://www.w3.org/2000/svg", mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("history") });
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--text-muted"), grid = css.getPropertyValue("--line"), col = css.getPropertyValue("--series-1");
  for (const v of [lo, hi].filter((v, i, a) => a.indexOf(v) === i)) {
    svg.append(mk("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: grid, "stroke-width": 1 }));
    const tx = mk("text", { x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 10, fill: ink }); tx.textContent = Math.round(v); svg.append(tx);
  }
  for (const [tm, anchor] of [[t0, "start"], [t1, "end"]]) {
    const tx = mk("text", { x: X(tm), y: H - 6, "text-anchor": anchor, "font-size": 10, fill: ink }); tx.textContent = shortDate(tm); svg.append(tx);
  }
  let d = `M${X(series[0].t)},${Y(series[0].v)}`;
  for (let i = 1; i < series.length; i++) d += ` H${X(series[i].t)} V${Y(series[i].v)}`;
  svg.append(mk("path", { d, fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round" }));
  series.filter(p => !p.carry).forEach(p => svg.append(mk("circle", { cx: X(p.t), cy: Y(p.v), r: 4, fill: col, stroke: css.getPropertyValue("--surface-1"), "stroke-width": 2 })));
  const hair = mk("line", { y1: Tp, y2: H - B, stroke: ink, "stroke-width": 1, visibility: "hidden" });
  const dot = mk("circle", { r: 5, fill: col, visibility: "hidden" });
  const hit = mk("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent", tabindex: 0 });
  svg.append(hair, dot, hit); box.append(svg);
  const tip = el("div", "tip"); box.append(tip);
  const show = clientX => {
    const r = svg.getBoundingClientRect(), sx = (clientX - r.left) / r.width * W;
    const tm = t0 + (Math.min(Math.max(sx, L), W - R) - L) / (W - L - R) * (t1 - t0);
    let p = series[0]; for (const q of series) if (q.t <= tm) p = q;
    const px = X(Math.min(Math.max(tm, t0), t1));
    hair.setAttribute("x1", px); hair.setAttribute("x2", px); dot.setAttribute("cx", px); dot.setAttribute("cy", Y(p.v));
    hair.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("b", null, dh(p.v)), document.createTextNode(shortDate(tm)));
    tip.style.display = "block";
    const left = px / W * r.width; tip.style.left = Math.min(Math.max(left - 40, 0), r.width - 90) + "px"; tip.style.top = "0px";
  };
  const hide = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", e => show(e.clientX)); hit.addEventListener("pointerdown", e => show(e.clientX));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => show(svg.getBoundingClientRect().right - 1)); hit.addEventListener("blur", hide);
  const det = el("details"); det.append(el("summary", null, t("table")));
  const tb = el("table"); const hr = el("tr"); T[lang].th.forEach(h => hr.append(el("th", null, h))); tb.append(hr);
  pts.slice().reverse().forEach(p => { const tr = el("tr"); tr.append(el("td", null, fmtDate(p[0])), el("td", null, dh(p[1])), el("td", null, p[2] ? dh(p[2]) : "–")); tb.append(tr); });
  det.append(tb); box.append(det);
}

// ---------------- navigation ----------------
function go(view) {
  currentView = view;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.v === view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + view));
  $("#title").textContent = t("title_" + view);
  $("#genders").style.display = (view === "deals" || view === "stats") ? "" : "none";
  if (view === "home") renderHome();
  else if (view === "watch") { setUpdated(null); renderWatch(); }
  else { const d = CACHE[gender]; if (d) setUpdated(d.updated, d.items.filter(x => x.s).length); }
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));

function refreshAll() {
  applyStaticText();
  go(currentView);
  if (CACHE[gender]) { selectGender(gender); }
}

// deep links: #p=<gender>/<handle> opens that perfume, #about opens the info panel
async function openFromHash() {
  const m = location.hash.match(/^#p=(men|women|unisex)\/([\w-]+)$/);
  if (m) {
    try { const d = await loadGender(m[1]); const x = d.by[m[2]]; if (x) { history.replaceState(null, "", location.pathname + location.search); openSheet(x); } }
    catch {}
  } else if (location.hash === "#about") { history.replaceState(null, "", location.pathname + location.search); openAbout(); }
}

addEventListener("hashchange", openFromHash);   // a share link opened while the site is already open

// ---------------- offline + analytics ----------------
const net = () => $("#offline").style.display = navigator.onLine ? "none" : "block";
addEventListener("online", net); addEventListener("offline", net); net();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (GOATCOUNTER) {
  const sc = document.createElement("script"); sc.async = true; sc.src = "https://gc.zgo.at/count.js";
  sc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`; document.head.append(sc);
}

// ---------------- start ----------------
applyStaticText();
loadFileWatch().then(() => { go("home"); selectGender(gender); openFromHash(); });
</script>
